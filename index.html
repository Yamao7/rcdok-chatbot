<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCDoK AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      background: #f5f0e8;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #4a1c1c;
      color: #f5e6c8;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: normal; }
    header span { font-size: 13px; opacity: 0.7; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 15px;
    }
    .user {
      background: #4a1c1c;
      color: white;
      align-self: flex-end;
      border-radius: 12px 4px 12px 12px;
    }
    .bot {
      background: white;
      color: #2a1a0a;
      align-self: flex-start;
      border-radius: 4px 12px 12px 12px;
      border: 1px solid #ddd;
    }
    .typing {
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px 12px 12px 12px;
      padding: 12px 16px;
      align-self: flex-start;
      color: #888;
      font-style: italic;
    }
    #input-area {
      padding: 16px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
    }
    #user-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 15px;
      font-family: Georgia, serif;
      resize: none;
    }
    #send-btn {
      background: #4a1c1c;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 15px;
    }
    #send-btn:hover { background: #6a2c2c; }
    #send-btn:disabled { background: #ccc; cursor: default; }
  </style>
</head>
<body>
  <header>
    <span>✝</span>
    <div>
      <h1>Diocese of Kalookan — AI Assistant</h1>
      <span>Ask me about parishes, the bishop, missions, and more</span>
    </div>
  </header>

  <div id="chat">
    <div class="message bot">
      Praised be Jesus and Mary! I'm the official AI assistant of the Diocese of Kalookan.
      How can I help you today?
    </div>
  </div>

  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Type your question..."></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("user-input");
    const btn = document.getElementById("send-btn");
    let history = [];

    // Auto-resize textarea
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    // Send on Enter (Shift+Enter for newline)
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    btn.addEventListener("click", sendMessage);

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // Show user message
      addMessage(text, "user");
      input.value = "";
      input.style.height = "auto";
      btn.disabled = true;

      // Show typing indicator
      const typingEl = document.createElement("div");
      typingEl.className = "typing";
      typingEl.textContent = "Thinking...";
      chat.appendChild(typingEl);
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch("http://localhost:8000/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history })
        });

        const data = await response.json();
        typingEl.remove();

        addMessage(data.reply, "bot");

        // Update history
        history.push({ role: "user", content: text });
        history.push({ role: "assistant", content: data.reply });

      } catch (err) {
        typingEl.remove();
        addMessage("Sorry, I couldn't connect to the server. Please make sure the chatbot server is running.", "bot");
      }

      btn.disabled = false;
      input.focus();
    }

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = `message ${who}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
